<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Remote Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a2e; --surface: #16213e; --surface-hover: #1a2744;
      --accent: #4361ee; --accent-hover: #3a56d4;
      --text: #e0e0e0; --text-dim: #888; --border: #2a2a4a;
      --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.offline { background: var(--red); }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }
    .login-page { display: flex; align-items: center; justify-content: center; flex: 1; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; }
    .login-box h2 { text-align: center; margin-bottom: 24px; font-size: 18px; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 4px; }
    .login-box button:hover { background: var(--accent-hover); }
    .login-box .toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-dim); }
    .login-box .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .login-error { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 8px; min-height: 20px; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header button { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
    .device-list { flex: 1; overflow-y: auto; }
    .device-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .device-item:hover { background: var(--surface-hover); }
    .device-item.selected { background: var(--accent); color: #fff; }
    .device-item .name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .device-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .device-item.selected .meta { color: rgba(255,255,255,0.7); }
    .online-badge { width: 6px; height: 6px; background: var(--green); border-radius: 50%; display: inline-block; }
    .offline-badge { width: 6px; height: 6px; background: var(--red); border-radius: 50%; display: inline-block; }
    .mode-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: auto; }
    .mode-badge.review { background: var(--yellow); color: #000; }
    .mode-badge.auto { background: var(--green); color: #000; }
    .no-devices { padding: 20px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .chat-panel { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
    .chat-header .active-device { color: var(--text); font-weight: 500; }
    .chat-header .mode-toggle { display: flex; align-items: center; gap: 8px; }
    .chat-header .mode-toggle select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin-bottom: 12px; max-width: 80%; }
    .msg.sent { margin-left: auto; text-align: right; }
    .msg.received { margin-right: auto; }
    .msg-bubble { display: inline-block; padding: 8px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    .msg.sent .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-time { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .msg-status { font-size: 10px; }
    .msg-status.error { color: var(--red); }
    .msg-status.completed { color: var(--green); }
    .msg-status.rejected { color: var(--yellow); }
    .input-area { display: flex; padding: 12px 20px; gap: 10px; border-top: 1px solid var(--border); background: var(--surface); }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
    .input-area input:focus { border-color: var(--accent); }
    .input-area input:disabled { opacity: 0.4; }
    .input-area button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .input-area button:hover { background: var(--accent-hover); }
    .input-area button:disabled { opacity: 0.4; }
    .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; }
    .modal h3 { margin-bottom: 16px; font-size: 16px; }
    .modal .token-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; word-break: break-all; margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
    .modal .hint { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.5; }
    .modal .hint code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
    .modal-actions .btn-copy { background: var(--accent); color: #fff; }
    .modal-actions .btn-close { background: var(--border); color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h2>Hermes Remote Control</h2>
      <div id="loginError" class="login-error"></div>
      <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
      <button id="authBtn" onclick="handleAuth()">Login</button>
      <div class="toggle" id="authToggle">No account? <a onclick="toggleAuthMode()">Register</a></div>
    </div>
  </div>
  <div id="mainApp" class="hidden" style="height:100vh;">
    <div class="header">
      <h1>Hermes Remote Control</h1>
      <div class="header-right">
        <span><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting...</span></span>
        <span id="userEmail" style="color:var(--text-dim);"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="main">
      <div class="sidebar">
        <div class="sidebar-header"><span>Devices</span><button onclick="showEnrollModal()">+ Add</button></div>
        <div class="device-list" id="deviceList"><div class="no-devices">Waiting for devices...</div></div>
      </div>
      <div class="chat-panel" id="chatPanel">
        <div class="placeholder" id="placeholder">Select a device to send commands</div>
        <div id="chatView" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
          <div class="chat-header">
            <span>Sending to: <span class="active-device" id="activeDeviceName">-</span></span>
            <div class="mode-toggle"><span style="font-size:12px;">Mode:</span><select id="modeSelect" onchange="changeDeviceMode(this.value)"><option value="review">Review</option><option value="auto">Auto</option></select></div>
          </div>
          <div class="messages" id="messages"></div>
          <div class="input-area">
            <input type="text" id="msgInput" placeholder="Type a command..." disabled autocomplete="off">
            <button id="sendBtn" disabled onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="enrollModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Add New Device</h3>
      <p class="hint">Run this command on the target device:</p>
      <div class="hint"><code>node client.js --enroll &lt;token&gt; --url <span id="serverUrlHint"></span></code></div>
      <div class="token-box" id="enrollTokenBox">Loading...</div>
      <div class="modal-actions">
        <button class="btn-copy" onclick="copyEnrollToken()">Copy Token</button>
        <button class="btn-close" onclick="hideEnrollModal()">Close</button>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let isRegisterMode = false;
    let accessToken = sessionStorage.getItem('accessToken');
    let refreshToken = sessionStorage.getItem('refreshToken');
    let userId = sessionStorage.getItem('userId');
    let userEmail = sessionStorage.getItem('userEmail');
    let socket = null;
    let devices = [];
    let selectedDeviceId = null;
    const history = {};

    async function api(path, method, body) {
      method = method || 'GET';
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      if (accessToken) opts.headers['Authorization'] = 'Bearer ' + accessToken;
      const res = await fetch(path, opts);
      const data = await res.json();
      if (res.status === 401 && refreshToken) {
        const rr = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken }) });
        if (rr.ok) { const rd = await rr.json(); accessToken = rd.accessToken; sessionStorage.setItem('accessToken', accessToken); return api(path, method, body); }
        else { doLogout(); return null; }
      }
      return { status: res.status, data };
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authBtn').textContent = isRegisterMode ? 'Register' : 'Login';
      document.getElementById('authToggle').innerHTML = isRegisterMode ? 'Have an account? <a onclick="toggleAuthMode()">Login</a>' : 'No account? <a onclick="toggleAuthMode()">Register</a>';
    }

    async function handleAuth() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      if (!email || !password) { errorEl.textContent = 'Please fill in all fields'; return; }
      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const res = await api(endpoint, 'POST', { email, password });
      if (!res) return;
      if (res.status === 200) {
        accessToken = res.data.accessToken; refreshToken = res.data.refreshToken; userId = res.data.userId; userEmail = email;
        sessionStorage.setItem('accessToken', accessToken); sessionStorage.setItem('refreshToken', refreshToken);
        sessionStorage.setItem('userId', userId); sessionStorage.setItem('userEmail', userEmail);
        showMainApp();
      } else { errorEl.textContent = res.data.error || 'Authentication failed'; }
    }

    function logout() { doLogout(); }
    function doLogout() { sessionStorage.clear(); accessToken = null; refreshToken = null; userId = null; userEmail = null; if (socket) socket.disconnect(); showLoginPage(); }
    function showLoginPage() { document.getElementById('loginPage').classList.remove('hidden'); document.getElementById('mainApp').classList.add('hidden'); }
    function showMainApp() {
      document.getElementById('loginPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('mainApp').style.display = 'flex'; document.getElementById('userEmail').textContent = userEmail;
      connectSocket();
    }

    function connectSocket() {
      socket = io({ auth: { token: accessToken } });
      socket.on('connect', () => { document.getElementById('statusDot').className = 'status-dot online'; document.getElementById('statusText').textContent = 'Connected'; });
      socket.on('disconnect', () => { document.getElementById('statusDot').className = 'status-dot offline'; document.getElementById('statusText').textContent = 'Disconnected'; });
      socket.on('devices:update', (list) => { devices = list; renderDeviceList(); });
      socket.on('device:response', ({ deviceId, deviceName, commandId, text, status, timestamp }) => {
        if (!history[deviceId]) history[deviceId] = [];
        history[deviceId].push({ type: 'received', text, time: timestamp, deviceName, status });
        if (deviceId === selectedDeviceId) renderMessages();
      });
      socket.on('error', ({ message }) => { alert('Error: ' + message); });
    }

    function renderDeviceList() {
      const el = document.getElementById('deviceList');
      if (devices.length === 0) { el.innerHTML = '<div class="no-devices">No devices. Click + Add.</div>'; if (selectedDeviceId) { selectedDeviceId = null; showPlaceholder(); } return; }
      el.innerHTML = devices.map(d => {
        const sel = d.deviceId === selectedDeviceId ? 'selected' : '';
        const badge = d.status === 'online' ? 'online-badge' : 'offline-badge';
        const time = new Date(d.lastSeen).toLocaleTimeString();
        return '<div class="device-item ' + sel + '" data-id="' + d.deviceId + '"><div class="name"><span class="' + badge + '"></span>' + escHtml(d.name) + '<span class="mode-badge ' + d.mode + '">' + d.mode + '</span></div><div class="meta">' + d.os + ' | ' + d.status + ' | ' + time + '</div></div>';
      }).join('');
      el.querySelectorAll('.device-item').forEach(e => { e.addEventListener('click', () => selectDevice(e.dataset.id)); });
    }

    function selectDevice(deviceId) {
      selectedDeviceId = deviceId;
      const dev = devices.find(d => d.deviceId === deviceId);
      if (!dev) return;
      document.getElementById('activeDeviceName').textContent = dev.name;
      document.getElementById('modeSelect').value = dev.mode;
      document.getElementById('msgInput').disabled = false; document.getElementById('sendBtn').disabled = false;
      document.getElementById('placeholder').style.display = 'none'; document.getElementById('chatView').style.display = 'flex';
      document.getElementById('msgInput').focus();
      renderDeviceList(); renderMessages();
    }

    function showPlaceholder() { document.getElementById('placeholder').style.display = 'flex'; document.getElementById('chatView').style.display = 'none'; }

    function sendMessage() {
      const text = document.getElementById('msgInput').value.trim();
      if (!text || !selectedDeviceId || !socket) return;
      socket.emit('command:send', { deviceId: selectedDeviceId, text });
      if (!history[selectedDeviceId]) history[selectedDeviceId] = [];
      history[selectedDeviceId].push({ type: 'sent', text, time: Date.now() });
      renderMessages(); document.getElementById('msgInput').value = ''; document.getElementById('msgInput').focus();
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && document.activeElement === document.getElementById('msgInput')) sendMessage(); });

    function renderMessages() {
      const el = document.getElementById('messages');
      const msgs = history[selectedDeviceId] || [];
      if (msgs.length === 0) { el.innerHTML = '<div class="no-devices">No messages yet</div>'; return; }
      el.innerHTML = msgs.map(m => {
        const time = new Date(m.time).toLocaleTimeString();
        if (m.type === 'sent') return '<div class="msg sent"><div class="msg-bubble">' + escHtml(m.text) + '</div><div class="msg-time">' + time + '</div></div>';
        const sc = m.status === 'error' ? 'error' : m.status === 'rejected' ? 'rejected' : 'completed';
        return '<div class="msg received"><div class="msg-bubble">' + escHtml(m.text) + '</div><div class="msg-time">' + time + ' <span class="msg-status ' + sc + '">' + (m.status || '') + '</span></div></div>';
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    function changeDeviceMode(mode) {
      if (!selectedDeviceId) return;
      // Update mode via REST then refresh
      api('/api/devices/' + selectedDeviceId + '/mode', 'POST', { mode });
    }

    let currentEnrollToken = '';
    async function showEnrollModal() {
      document.getElementById('enrollModal').classList.remove('hidden');
      document.getElementById('enrollTokenBox').textContent = 'Loading...';
      document.getElementById('serverUrlHint').textContent = location.origin;
      const res = await api('/api/devices/enroll-token', 'POST');
      if (res && res.status === 200) { currentEnrollToken = res.data.enrollmentToken; document.getElementById('enrollTokenBox').textContent = currentEnrollToken; }
      else { document.getElementById('enrollTokenBox').textContent = 'Failed to generate token'; }
    }
    function hideEnrollModal() { document.getElementById('enrollModal').classList.add('hidden'); }
    function copyEnrollToken() { navigator.clipboard.writeText(currentEnrollToken).then(() => alert('Token copied!')); }
    function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    if (accessToken) showMainApp();
  </script>
</body>
</html>
