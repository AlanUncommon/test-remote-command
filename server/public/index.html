<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-hover: #1a2744;
      --accent: #4361ee;
      --accent-hover: #3a56d4;
      --text: #e0e0e0;
      --text-dim: #888;
      --border: #2a2a4a;
      --green: #4ade80;
      --red: #f87171;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 6px;
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.offline { background: var(--red); }

    .main { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 240px; min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 12px 16px;
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .device-list { flex: 1; overflow-y: auto; }
    .device-item {
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .device-item:hover { background: var(--surface-hover); }
    .device-item.selected { background: var(--accent); color: #fff; }
    .device-item .name { font-size: 14px; font-weight: 500; }
    .device-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .device-item.selected .meta { color: rgba(255,255,255,0.7); }
    .online-badge {
      display: inline-block; width: 6px; height: 6px;
      background: var(--green); border-radius: 50%; margin-right: 6px;
    }
    .no-devices { padding: 20px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }

    .chat-panel { flex: 1; display: flex; flex-direction: column; }
    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px; color: var(--text-dim);
    }
    .chat-header .active-device { color: var(--text); font-weight: 500; }

    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin-bottom: 12px; max-width: 80%; }
    .msg.sent { margin-left: auto; text-align: right; }
    .msg.received { margin-right: auto; }
    .msg-bubble {
      display: inline-block; padding: 8px 14px;
      border-radius: 12px; font-size: 14px; line-height: 1.4;
      word-break: break-word;
    }
    .msg.sent .msg-bubble {
      background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.received .msg-bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-time { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .msg-device-name { font-size: 11px; color: var(--accent); margin-bottom: 2px; }

    .input-area {
      display: flex; padding: 12px 20px; gap: 10px;
      border-top: 1px solid var(--border); background: var(--surface);
    }
    .input-area input {
      flex: 1; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    .input-area input:focus { border-color: var(--accent); }
    .input-area input:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-area button {
      padding: 10px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
      transition: background 0.15s;
    }
    .input-area button:hover { background: var(--accent-hover); }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .placeholder {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Device Control</h1>
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">Devices</div>
      <div class="device-list" id="deviceList">
        <div class="no-devices">Waiting for devices...</div>
      </div>
    </div>

    <div class="chat-panel" id="chatPanel">
      <div class="placeholder" id="placeholder">Select a device to send commands</div>
      <div id="chatView" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
        <div class="chat-header">
          Sending to: <span class="active-device" id="activeDeviceName">-</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
          <input type="text" id="msgInput" placeholder="Type a command..." disabled autocomplete="off">
          <button id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const deviceListEl = document.getElementById('deviceList');
    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const placeholder = document.getElementById('placeholder');
    const chatView = document.getElementById('chatView');
    const activeDeviceNameEl = document.getElementById('activeDeviceName');

    let devices = [];
    let selectedDeviceId = null;
    const history = {};

    socket.on('connect', () => {
      statusDot.className = 'status-dot online';
      statusText.textContent = 'Connected';
    });
    socket.on('disconnect', () => {
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'Disconnected';
    });

    socket.on('devices:update', (list) => {
      devices = list;
      renderDeviceList();
    });

    function renderDeviceList() {
      if (devices.length === 0) {
        deviceListEl.innerHTML = '<div class="no-devices">No devices connected</div>';
        if (selectedDeviceId) { selectedDeviceId = null; showPlaceholder(); }
        return;
      }
      deviceListEl.innerHTML = devices.map(d => {
        const sel = d.id === selectedDeviceId ? 'selected' : '';
        const time = new Date(d.connectedAt).toLocaleTimeString();
        return `<div class="device-item ${sel}" data-id="${d.id}">
          <div class="name"><span class="online-badge"></span>${escHtml(d.name)}</div>
          <div class="meta">Online since ${time}</div>
        </div>`;
      }).join('');
      deviceListEl.querySelectorAll('.device-item').forEach(el => {
        el.addEventListener('click', () => selectDevice(el.dataset.id));
      });
    }

    function selectDevice(deviceId) {
      selectedDeviceId = deviceId;
      const dev = devices.find(d => d.id === deviceId);
      if (!dev) return;
      activeDeviceNameEl.textContent = dev.name;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      placeholder.style.display = 'none';
      chatView.style.display = 'flex';
      msgInput.focus();
      renderDeviceList();
      renderMessages();
    }

    function showPlaceholder() {
      placeholder.style.display = 'flex';
      chatView.style.display = 'none';
      msgInput.disabled = true;
      sendBtn.disabled = true;
    }

    socket.on('device:response', ({ deviceId, deviceName, commandId, text, timestamp }) => {
      if (!history[deviceId]) history[deviceId] = [];
      history[deviceId].push({ type: 'received', text, time: timestamp, deviceName });
      if (deviceId === selectedDeviceId) renderMessages();
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !selectedDeviceId) return;
      socket.emit('command:send', { deviceId: selectedDeviceId, text });
      if (!history[selectedDeviceId]) history[selectedDeviceId] = [];
      history[selectedDeviceId].push({ type: 'sent', text, time: Date.now() });
      renderMessages();
      msgInput.value = '';
      msgInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    function renderMessages() {
      const msgs = history[selectedDeviceId] || [];
      if (msgs.length === 0) {
        messagesEl.innerHTML = '<div class="no-devices">No messages yet</div>';
        return;
      }
      messagesEl.innerHTML = msgs.map(m => {
        const time = new Date(m.time).toLocaleTimeString();
        if (m.type === 'sent') {
          return `<div class="msg sent"><div class="msg-bubble">${escHtml(m.text)}</div><div class="msg-time">${time}</div></div>`;
        }
        return `<div class="msg received"><div class="msg-device-name">${escHtml(m.deviceName)}</div><div class="msg-bubble">${escHtml(m.text)}</div><div class="msg-time">${time}</div></div>`;
      }).join('');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
